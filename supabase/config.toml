# Supabase local dev config — https://supabase.com/docs/guides/cli/config
[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false          # disable for dev; enable in production

[auth.email.template.magic_link]
subject = "Your FTC sign-in code"
content_path = "./supabase/templates/magic-link.html"

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Find To Connect OTP is {{ .Code }}. Valid for 10 minutes."

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""

[edge_runtime]
policy = "per_worker"

[analytics]
enabled = false
